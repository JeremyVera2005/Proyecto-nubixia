name: nubixia
services:
  backend:
    image: nubixia/backend:${NUBIXIA_IMAGE_TAG:-1.0.0}
    build:
      context: ./comprobantes-serverless
      target: runtime
    environment:
      NUBIXIA_API_KEY: ${NUBIXIA_API_KEY:-nubixia-demo-local-2026}
      NUBIXIA_DB_PASSWORD: ${NUBIXIA_DB_PASSWORD:-nubixia-local-db}
      NUBIXIA_CORS_ORIGIN: http://localhost:${NUBIXIA_WEB_PORT:-8088}
      NUBIXIA_RATE_LIMIT: ${NUBIXIA_RATE_LIMIT:-120}
      SPRING_H2_CONSOLE_ENABLED: "false"
    volumes:
      - nubixia-data:/app/data
    networks: [backend]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
  frontend:
    image: nubixia/frontend:${NUBIXIA_IMAGE_TAG:-1.0.0}
    build:
      context: ./comprobastes-serverless-frontend
      target: runtime
    environment:
      NUBIXIA_API_KEY: ${NUBIXIA_API_KEY:-nubixia-demo-local-2026}
    ports:
      - "127.0.0.1:${NUBIXIA_WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks: [web, backend]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
  verify:
    image: node:24-alpine
    profiles: [tools]
    working_dir: /tmp
    command: [node, /checks/verify.mjs]
    environment:
      API_URL: http://backend:8080
      NUBIXIA_API_KEY: ${NUBIXIA_API_KEY:-nubixia-demo-local-2026}
    volumes:
      - ./scripts/verify.mjs:/checks/verify.mjs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  web: {}
  backend:
    internal: true
volumes:
  nubixia-data: {}
