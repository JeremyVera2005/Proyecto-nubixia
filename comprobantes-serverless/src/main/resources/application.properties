spring.application.name=nubixia-comprobantes
server.port=${PORT:8080}
nubixia.api-key=${NUBIXIA_API_KEY:nubixia-demo-local-2026}
nubixia.data-dir=${NUBIXIA_DATA_DIR:./data}
nubixia.cors-origin=${NUBIXIA_CORS_ORIGIN:http://localhost:4200}
nubixia.rate-limit=${NUBIXIA_RATE_LIMIT:120}
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.pe.nubixia=INFO
spring.datasource.url=jdbc:h2:file:${NUBIXIA_DATA_DIR:./data}/nubixia;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=nubixia
spring.datasource.password=${NUBIXIA_DB_PASSWORD:nubixia-local-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.flyway.enabled=true
